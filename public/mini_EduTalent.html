            try {
                // Simpan log ke localStorage sebagai backup
                const logs = JSON.parse(localStorage.getItem('EduTalent_sync_log') || '[]');
                logs.push({ timestamp: new Date().toISOString(), action, data });
                localStorage.setItem('EduTalent_sync_log', JSON.stringify(logs));

                // Kirim ke Google Sheet via POST
                fetch(GOOGLE_SHEET_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Mencegah error CORS di browser
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, data })

                console.log("Error localStorage:", e);

            { "id": 173, "modul": "Preferensi Lingkungan", "dimensi": "Statis vs Dinamis", "soal": "Saya merasa jenuh bekerja di lingkungan yang ritmenya selalu sama dan jarang ada tantangan baru.", "tipe": "Reflektif" },
            { "id": 174, "modul": "Preferensi Lingkungan", "dimensi": "Low vs High Pressure", "soal": "Saya justru merasa kurang bersemangat jika tidak ada tuntutan target kerja atau tenggat waktu (deadline) yang ketat.", "tipe": "Reflektif" },
            { "id": 175, "modul": "Preferensi Lingkungan", "dimensi": "Formal vs Santai", "soal": "Menurut saya, suasana kerja yang terlalu santai dan tidak memiliki aturan seragam akan menurunkan profesionalisme saya.", "tipe": "Reflektif" },
            { "id": 176, "modul": "Preferensi Lingkungan", "dimensi": "Indoor vs Outdoor", "soal": "Bekerja berpindah-pindah tempat atau berada di luar ruangan sangat menguras energi saya; saya lebih suka diam di ruangan.", "tipe": "Reflektif" }
        ];

        // --- ALGORITMA SAMPLING & MESIN ---
        const getQuestions = (mode) => {
            // Mode lengkap mengembalikan seluruh soal tanpa dipotong
            if (mode === 'lengkap') return [...QUESTIONS_FULL];

            let limit = mode === 'cepat' ? 40 : 20;

            // Mengelompokkan soal berdasarkan dimensi (Stratified)
            const grouped = {};
            QUESTIONS_FULL.forEach(q => {
                if (!grouped[q.dimensi]) grouped[q.dimensi] = [];
                grouped[q.dimensi].push(q);
            });

            // Mengacak urutan soal di dalam masing-masing dimensi
            for (let dim in grouped) {
                grouped[dim] = grouped[dim].sort(() => 0.5 - Math.random());
            }

            // Mengacak urutan dimensi agar adil
            let dimensions = Object.keys(grouped).sort(() => 0.5 - Math.random());
            let selected = [];

            // Round-robin selection: mengambil 1 soal bergantian dari tiap dimensi sampai target limit tercapai
            let idx = 0;
            while (selected.length < limit) {
                let dim = dimensions[idx % dimensions.length];
                if (grouped[dim].length > 0) {
                    selected.push(grouped[dim].shift());
                }
                idx++;
            }

            // Mengacak urutan hasil akhir sebelum diberikan kepada user
            return selected.sort(() => 0.5 - Math.random());
        };

        // --- SUB COMPONENTS ---

        const generateAnalysis = (primary, secondary) => {
            const primaryData = CATEGORIES[primary];
            const secondaryData = CATEGORIES[secondary];
            return `Berdasarkan hasil asesmen, kamu memiliki pola minat yang unik. Kekuatan terbesarmu ada pada tipe **${primaryData.label}**. \nIni berarti kamu cenderung memiliki energi alami saat ${primaryData.desc.toLowerCase()} \n\nNamun, kamu tidak hanya satu dimensi. Kamu juga memiliki sisi **${secondaryData.label}** yang cukup kuat. \nKombinasi ini menarik karena kamu bisa menyeimbangkan antara fokus utama dengan kemampuan pendukung dari tipe kedua.\n\n**Saran Pengambilan Keputusan:**\nJangan merasa tertekan untuk memilih satu jalur yang "sempurna". Gunakan hasil ini sebagai kompas. \nJika kamu memilih lanjut kuliah atau bekerja, carilah lingkungan yang menghargai kemampuanmu dalam ${primaryData.desc.split(',')[0].toLowerCase()}. \nHasil ini bukan vonis, melainkan cermin potensi yang bisa kamu asah lebih jauh.`;
        };

        const VariantAssessment = ({ mode, onBack }) => {
            const [step, setStep] = useState('identity');
            const [user, setUser] = useState({ name: '', date: '' });
            const [scores, setScores] = useState({});
            const [counts, setCounts] = useState({});
            const [rawAnswers, setRawAnswers] = useState([]);
            const [idx, setIdx] = useState(0);

            const questions = useMemo(() => getQuestions(mode), [mode]);

            useEffect(() => {
                const today = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                setUser(u => ({ ...u, date: today }));
            }, []);

            useEffect(() => {
                if (step === 'result') {
                    // Sync hasil ketika masuk ke halaman hasil
                    syncToGoogleSheet("hasil_asesmen", { nama: user.name, tanggal: user.date, mode: mode, rawAnswers: rawAnswers });
                }
            }, [step]);

            const handleStartQuiz = (e) => {
                e.preventDefault();
                if (user.name.trim()) {
                    syncToGoogleSheet("mulai_asesmen", { nama: user.name, tanggal: user.date, mode: mode });
                    setStep('quiz');
                }
            };
            const [showReviewModal, setShowReviewModal] = useState(false);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);

            const handleAnswer = (val) => {
                const q = questions[idx];
                let finalVal = val;
                if (q.tipe === 'Reflektif') {
                    finalVal = 6 - val; // Reverse scoring skala 5
                }

                setScores(prev => ({ ...prev, [q.dimensi]: (prev[q.dimensi] || 0) + finalVal }));
                setCounts(prev => ({ ...prev, [q.dimensi]: (prev[q.dimensi] || 0) + 1 }));
                setRawAnswers(prev => {
                    const newAnswers = [...prev];
                    newAnswers[idx] = val; // Store at specific index
                    return newAnswers;
                });

                if (idx < questions.length - 1) setIdx(idx + 1);
                else setShowReviewModal(true); // Tampilkan modal review di akhir
            };

            const [isPrinting, setIsPrinting] = useState(false);
            const [pendingPrint, setPendingPrint] = useState(false);

            const handlePrint = () => {
                const element = document.getElementById('printable-result');
                if (!element) return;

                setIsPrinting(true);

                try {
                    if (typeof window.html2pdf === 'undefined') {
                        throw new Error("Library html2pdf belum termuat");
                    }

                    const opt = {
                        margin: [5, 5, 5, 5],
                        filename: `Hasil_Asesmen_${user.name.replace(/ /g, '_')}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    window.html2pdf().set(opt).from(element).save()
                        .then(() => setIsPrinting(false))
                        .catch(err => {
                            console.error("PDF Error:", err);
                            setIsPrinting(false);
                            window.print(); // Fallback
                        });
                } catch (error) {
                    console.error("PDF Exception:", error);
                    setIsPrinting(false);
                    window.print(); // Fallback
                }
            };

            const handlePrintClick = () => {
                if (localStorage.getItem('EduTalent_has_reviewed') === 'true') {
                    handlePrint();
                } else {
                    setPendingPrint(true);
                    setShowFeedbackModal(true);
                }
            };

            if (step === 'identity') return (
                <div className="max-w-xl w-full mx-auto bg-white rounded-2xl shadow-xl p-8 mt-10 border-t-8 border-red-800">
                    <button onClick={onBack} className="text-gray-400 hover:text-gray-600 mb-6 flex items-center gap-1"><Icons.ArrowLeft size={16} /> Menu Utama</button>
                    <div className="text-center mb-8"><div className="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 text-yellow-600"><Icons.FileText size={32} /></div><h1 className="text-2xl font-bold text-red-900">Asesmen Karakter: Mode {mode.charAt(0).toUpperCase() + mode.slice(1)}</h1><p className="text-gray-500">Terdapat {questions.length} pertanyaan pada sesi ini.</p></div>
                    <form onSubmit={handleStartQuiz} className="space-y-4">
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap Mahasiswa / Siswa</label><input required type="text" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 outline-none" placeholder="Masukkan nama Anda..." value={user.name} onChange={(e) => setUser({ ...user, name: e.target.value })} /></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Asesmen</label><input disabled type="text" className="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-500" value={user.date} /></div>
                        <button type="submit" className="w-full bg-red-800 text-white py-3 rounded-lg font-bold hover:bg-red-900 transition-colors">Lanjut ke Soal</button>
                    </form>
                </div>
            );

            if (step === 'quiz') {
                const q = questions[idx];
                const progress = ((idx + 1) / questions.length) * 100;

                const labelMap = { 5: "Sangat Setuju", 4: "Setuju", 3: "Netral", 2: "Tidak Setuju", 1: "Sangat Tidak Setuju" };

                return (
                    <div className="max-w-2xl mx-auto mt-10 relative">
                        {/* KOTAK KUIS */}
                        <div className="bg-white rounded-2xl shadow-lg p-8 border-t-8 border-red-800 relative z-10">
                            <div className="flex justify-between text-sm text-gray-500 mb-2"><span>Soal {idx + 1} dari {questions.length}</span><span>{Math.round(progress)}%</span></div>
                            <div className="w-full bg-gray-200 rounded-full h-2 mb-8"><div className="bg-red-800 h-2 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div></div>
                            <h2 className="text-xl md:text-2xl font-bold text-center mb-8 text-gray-800 leading-relaxed">"{q.soal}"</h2>
                            <div className="grid gap-3">
                                {[5, 4, 3, 2, 1].map(val => (
                                    <button
                                        key={val}
                                        onClick={() => handleAnswer(val)}
                                        className={`p-4 border rounded-xl text-left font-medium transition-all ${rawAnswers[idx] === val ? 'bg-red-800 text-white border-red-800 shadow-md transform scale-[1.02]' : 'bg-gray-50 border-gray-100 text-gray-800 hover:bg-gray-100'}`}>
                                        {labelMap[val]}
                                    </button>
                                ))}
                            </div>

                            <div className="mt-8 flex justify-between items-center border-t pt-6">
                                <button
                                    onClick={() => idx > 0 && setIdx(idx - 1)}
                                    disabled={idx === 0}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-500 hover:text-red-800 font-bold disabled:opacity-30 disabled:cursor-not-allowed transition-colors">
                                    <Icons.ArrowLeft size={18} /> Kembali
                                </button>

                                <button
                                    onClick={() => setShowReviewModal(true)}
                                    className="p-2 text-gray-400 hover:text-red-700 transition-colors"
                                    title="Lihat Semua Jawaban">
                                    <Icons.List size={20} />
                                </button>

                                <button
                                    onClick={() => idx < questions.length - 1 ? setIdx(idx + 1) : setShowReviewModal(true)}
                                    disabled={rawAnswers[idx] === undefined}
                                    className="flex items-center gap-2 px-6 py-2 bg-red-800 text-white rounded-xl font-bold hover:bg-red-900 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-red-900/20 transition-all">
                                    {idx === questions.length - 1 ? 'Selesai' : 'Lanjut'} <Icons.ArrowRight size={18} />
                                </button>
                            </div>
                        </div>

                        {/* MODAL REVIEW */}
                        {showReviewModal && (
                            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden animate-fade-in">
                                    <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                                        <div>
                                            <h2 className="text-xl font-extrabold text-red-900 flex items-center gap-2"><Icons.FileText /> Review Lembar Jawaban</h2>
                                            <p className="text-xs text-gray-500 mt-1">Anda telah menjawab {rawAnswers.filter(a => a !== undefined).length} dari {questions.length} soal.</p>
                                        </div>
                                        <button onClick={() => setShowReviewModal(false)} className="p-2 bg-gray-200 text-gray-600 rounded-full hover:bg-red-100 hover:text-red-700 transition-colors"><Icons.X size={20} /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-3 bg-gray-100">
                                        {questions.map((q, i) => {
                                            const answered = rawAnswers[i] !== undefined;
                                            return (
                                                <div key={i} onClick={() => { setIdx(i); setShowReviewModal(false); }} className={`p-4 border rounded-xl cursor-pointer transition-all hover:border-red-400 hover:shadow-md ${answered ? 'bg-white border-gray-200' : 'bg-red-50 border-red-200'}`}>
                                                    <div className="flex justify-between items-start gap-4">
                                                        <div className="flex-1">
                                                            <div className="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Soal {i + 1} â€¢ {q.dimensi}</div>
                                                            <p className={`font-medium text-sm md:text-base ${answered ? 'text-gray-800' : 'text-red-900'}`}>{q.soal}</p>
                                                        </div>
                                                        <div className="shrink-0 text-right">
                                                            {answered ? (
                                                                <span className="text-xs font-bold text-white bg-green-600 px-3 py-1.5 rounded-full inline-block shadow-sm">
                                                                    {labelMap[rawAnswers[i]]} ({rawAnswers[i]})
                                                                </span>
                                                            ) : (
                                                                <span className="text-xs font-bold text-white bg-red-600 px-3 py-1.5 rounded-full inline-block shadow-sm animate-pulse">
                                                                    Belum Dijawab
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="p-6 border-t border-gray-200 bg-white flex justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-10 relative">
                                        <button onClick={() => setShowReviewModal(false)} className="px-6 py-2.5 rounded-xl text-gray-600 font-bold hover:bg-gray-100 transition-colors flex items-center gap-2">Tutup & Lanjut Kuis</button>
                                        <button
                                            onClick={() => { setShowReviewModal(false); setStep('result'); }}
                                            disabled={rawAnswers.filter(a => a !== undefined).length < questions.length}
                                            className="px-6 py-2.5 bg-red-800 text-white rounded-xl font-bold hover:bg-red-900 transition-colors shadow-lg shadow-red-900/30 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                            Kirim & Lihat Hasil <Icons.Check size={18} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (step === 'result') {
                // 1. NGASAL DETECTION â€” berbasis pola (selaras dengan ScoringService.php)
                const scoreCounts = {};
                rawAnswers.forEach(a => { scoreCounts[a] = (scoreCounts[a] || 0) + 1; });
                const n = rawAnswers.length;
                const neutralRate = (scoreCounts[3] || 0) / n;
                const extremeRate = ((scoreCounts[1] || 0) + (scoreCounts[5] || 0)) / n;
                const agreeRate = ((scoreCounts[4] || 0) + (scoreCounts[5] || 0)) / n;
                const uniqueVals = new Set(rawAnswers).size;
                const isNgasal = neutralRate >= 0.70 || extremeRate >= 0.85 || agreeRate >= 0.95 || uniqueVals <= 1;

                // 2. DYNAMIC NORMALIZATION (Fixed â€” selaras dengan ScoringService.php)
                let dimensionAvgs = {};
                Object.keys(scores).forEach(dim => dimensionAvgs[dim] = scores[dim] / counts[dim]);
                Object.keys(DIMENSION_MAP).forEach(dim => { if (!dimensionAvgs[dim]) dimensionAvgs[dim] = 0; });

                let normalizedUser = {};
                Object.keys(dimensionAvgs).forEach(dim => {
                    // Normalisasi tetap: skala 1-5 ke 0.0-1.0 (identik dengan ScoringService.php L54)
                    normalizedUser[dim] = dimensionAvgs[dim] > 0 ? (dimensionAvgs[dim] - 1) / 4 : 0.5;
                });

                // 3. SPK MATCHING (Hybrid PM + SAW)
                const professionMatches = PROFESSIONS.map(p => {
                    let totalScore = 0;
                    const WEIGHTS = { trait: 0.2, riasec: 0.4, work_values: 0.2, environment: 0.2 };
                    for (let group in WEIGHTS) {
                        let groupScore = 0;
                        let groupCount = 0;
                        Object.entries(DIMENSION_MAP).filter(([_, v]) => v.group === group).forEach(([dim, v]) => {
                            let userVal = normalizedUser[dim];
                            let targetVal = p[group][v.index];
                            groupScore += (1 - Math.abs(userVal - targetVal));
                            groupCount++;
                        });
                        totalScore += (groupScore / groupCount) * WEIGHTS[group];
                    }
                    return { ...p, match: totalScore * 100 };
                }).sort((a, b) => b.match - a.match);

                // 4. PREPARE RIASEC CHART DATA
                const riasecKeys = [{ k: 'R', dim: 'Realistic' }, { k: 'I', dim: 'Investigative' }, { k: 'A', dim: 'Artistic' }, { k: 'S', dim: 'Social' }, { k: 'E', dim: 'Enterprising' }, { k: 'C', dim: 'Conventional' }];
                const riasecScores = riasecKeys.map(item => ({ k: item.k, v: normalizedUser[item.dim] })).sort((a, b) => b.v - a.v);
                const primaryRiasec = riasecScores[0]?.k || 'R';
                const secondaryRiasec = riasecScores[1]?.k || 'I';
                const data = CATEGORIES[primaryRiasec];
                const analysisText = generateAnalysis(primaryRiasec, secondaryRiasec);

                return (
                    <div className="max-w-4xl mx-auto mt-6">
                        <FeedbackModal
                            isOpen={showFeedbackModal}
                            onClose={() => { setShowFeedbackModal(false); setPendingPrint(false); }}
                            userName={user.name}
                            mode={mode}
                            onSubmitSuccess={() => {
                                localStorage.setItem('EduTalent_has_reviewed', 'true');
                                if (pendingPrint) {
                                    handlePrint();
                                    setPendingPrint(false);
                                }
                            }}
                        />
                        <div className="flex justify-between items-center mb-6 no-print">

        const VariantExplorer = ({ onBack }) => {

            const envOptions = ["Teknis", "Komunikasi", "Mandiri", "Kolaboratif", "Statis", "Dinamis", "Low Pressure", "High Pressure", "Formal", "Santai", "Indoor", "Outdoor"];

            const riasecDimMap = { R: "Realistic", I: "Investigative", A: "Artistic", S: "Social", E: "Enterprising", C: "Conventional" };
            const envDimIndex = { "Teknis": 0, "Komunikasi": 0, "Mandiri": 1, "Kolaboratif": 1, "Statis": 2, "Dinamis": 2, "Low Pressure": 3, "High Pressure": 3, "Formal": 4, "Santai": 4, "Indoor": 5, "Outdoor": 5 };
            const envHighSide = { "Komunikasi": true, "Kolaboratif": true, "Dinamis": true, "High Pressure": true, "Santai": true, "Outdoor": true };

            // Pasangan filter lingkungan yang berlawanan (bipolar) â€”
            // memilih salah satu akan otomatis membatalkan pasangannya.
            const envPairs = {
                "Teknis": "Komunikasi", "Komunikasi": "Teknis",
                "Mandiri": "Kolaboratif", "Kolaboratif": "Mandiri",
                "Statis": "Dinamis", "Dinamis": "Statis",
                "Low Pressure": "High Pressure", "High Pressure": "Low Pressure",
                "Formal": "Santai", "Santai": "Formal",
                "Indoor": "Outdoor", "Outdoor": "Indoor"
            };

            const handleFilterChange = (dim, val) => {
                setFilters(prev => {
                    const current = prev[dim];
                    // Toggle off jika sudah aktif
                    if (current.includes(val)) return { ...prev, [dim]: current.filter(x => x !== val) };
                    // Hapus pasangan berlawanan (env bipolar conflict prevention)
                    const opposite = dim === 'env' ? (envPairs[val] || null) : null;
                    const withoutOpposite = opposite ? current.filter(x => x !== opposite) : current;
                    if (withoutOpposite.length >= 3) return prev; // Max 3
                    return { ...prev, [dim]: [...withoutOpposite, val] };
                });
            };

            const groupedResults = useMemo(() => {
                const hasAnyFilter = filters.riasec.length > 0 || filters.trait.length > 0 || filters.env.length > 0;

                const scored = PROFESSIONS.map(p => {
                    let score = 0, count = 0;
                    filters.riasec.forEach(k => {
                        const dim = riasecDimMap[k];
                        const idx = DIMENSION_MAP[dim]?.index ?? 0;
                        score += p.riasec[idx] ?? 0; count++;
                    });
                    filters.trait.forEach(t => {
                        const idx = DIMENSION_MAP[t]?.index ?? 0;
                        score += p.trait[idx] ?? 0; count++;
                    });
                    filters.env.forEach(e => {
                        const idx = envDimIndex[e] ?? 0;
                        const raw = p.environment[idx] ?? 0.5;
                        score += envHighSide[e] ? raw : (1 - raw); count++;
                    });
                    return { ...p, match: hasAnyFilter ? (count > 0 ? (score / count) * 100 : 0) : 100 };
                });

                const groups = {};

                        groups[p.domain] = { domain: p.domain, prodis: new Set(), professions: [], maxMatch: 0, ukm_coe: new Set() };

                    const g = groups[p.domain];
                    p.akademik.kuliah.split('/').forEach(s => g.prodis.add(s.trim()));
                    g.professions.push(p.name);
                    p.akademik.ukm_coe.split(',').forEach(s => g.ukm_coe.add(s.trim()));
                    if (p.match > g.maxMatch) g.maxMatch = p.match;
                });
                return Object.values(groups).sort((a, b) => b.maxMatch - a.maxMatch);

                            </h3>
                            <div className="flex flex-col gap-2">
                                {traitOptions.map(t => (
                                    <button key={t} onClick={() => handleFilterChange('trait', t)} className={`p-3 text-left text-xs rounded-xl border transition-all flex items-center justify-between ${filters.trait.includes(t) ? 'bg-yellow-600 text-white border-yellow-600 shadow-md' : 'bg-white text-gray-700 hover:border-yellow-400'}`}>

                                            <h4 className="font-extrabold text-red-900 text-xl leading-tight mb-4">{group.domain}</h4>

                                                        {Array.from(group.ukm_coe)

        const FeedbackModal = ({ isOpen, onClose, userName, mode, onSubmitSuccess }) => {
            const [ratings, setRatings] = useState({
                kesesuaian: 0,
                manfaat: 0,
                kemudahan: 0
            });
            const [comment, setComment] = useState('');
            const [submitted, setSubmitted] = useState(false);

            if (!isOpen) return null;

            const handleRating = (key, val) => {
                setRatings(prev => ({ ...prev, [key]: val }));
            };

            const handleSubmit = () => {
                if (ratings.kesesuaian === 0 || ratings.manfaat === 0 || ratings.kemudahan === 0) {
                    return alert('Silakan berikan semua rating terlebih dahulu.');
                }
                // Simpan feedback ke localStorage (persisten meski tab ditutup)
                try {
                    const feedbackData = {
                        timestamp: new Date().toISOString(),
                        nama: userName || 'Anonim',
                        ratings: { ...ratings },
                        comment,
                        source: mode || 'Unknown'
                    };
                    const existing = JSON.parse(localStorage.getItem('EduTalent_feedback_log') || '[]');
                    existing.push(feedbackData);
                    localStorage.setItem('EduTalent_feedback_log', JSON.stringify(existing));

                    // Sync ke Google Sheet
                    syncToGoogleSheet("review_aplikasi", feedbackData);
                } catch (e) {
                    // localStorage tidak tersedia (mode privat, dll.) â€” abaikan
                }
                setSubmitted(true);
                setTimeout(() => {
                    setSubmitted(false);
                    onClose();
                    if (onSubmitSuccess) onSubmitSuccess();
                }, 1500);
            };

            const renderStars = (key, label) => (
                <div className="mb-4">
                    <p className="text-sm font-semibold text-gray-700 mb-2">{label}</p>
                    <div className="flex gap-2">
                        {[1, 2, 3, 4, 5].map(star => (
                            <button
                                key={star}
                                onClick={() => handleRating(key, star)}
                                className={`transition-all transform hover:scale-110 ${ratings[key] >= star ? 'text-yellow-500' : 'text-gray-200'}`}>
                                <Icons.Star size={24} fill={ratings[key] >= star ? 'currentColor' : 'none'} />
                            </button>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-md overflow-y-auto">
                    <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden animate-fade-in my-8">
                        {submitted ? (
                            <div className="p-10 text-center">
                                <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <Icons.Check size={48} />
                                </div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">Terima Kasih!</h2>
                                <p className="text-gray-500">Feedback Anda sangat berarti bagi pengembangan EduTalent Asesmen.</p>
                            </div>
                        ) : (
                            <div className="p-8">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-red-900 flex items-center gap-2">
                                        <Icons.MessageSquare className="text-yellow-500" /> Review Aplikasi
                                    </h2>
                                    <button onClick={onClose} className="text-gray-400 hover:text-red-600"><Icons.X size={24} /></button>
                                </div>

                                <p className="text-gray-600 mb-6 text-sm">Bagaimana pengalaman Anda menggunakan EduTalent Asesmen hari ini? Masukan Anda membantu kami menjadi lebih baik.</p>

                                <div className="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                    {renderStars('kesesuaian', '1. Seberapa sesuai hasil asesmen dengan kenyataan diri Anda?')}
                                    {renderStars('manfaat', '2. Seberapa bermanfaat aplikasi ini bagi Anda?')}
                                    {renderStars('kemudahan', '3. Seberapa mudah aplikasi ini digunakan?')}
                                </div>

                                <div className="mb-6">
                                    <p className="text-sm font-semibold text-gray-700 mb-2">4. Saran dan Kritik</p>
                                    <textarea
                                        className="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 text-sm focus:ring-2 focus:ring-red-800 outline-none min-h-[100px]"
                                        placeholder="Tuliskan saran atau pengalaman Anda di sini..."
                                        value={comment}
                                        onChange={(e) => setComment(e.target.value)}
                                    ></textarea>
                                </div>

                                <button
                                    onClick={handleSubmit}
                                    className="w-full bg-red-800 text-white py-4 rounded-2xl font-bold hover:bg-red-900 transition-all shadow-lg shadow-red-900/20">
                                    Kirim Review
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [variant, setVariant] = useState('menu');
            const [showGlobalReview, setShowGlobalReview] = useState(false);

            if (variant === 'trial') return <div className="min-h-screen bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('./gambar/Gedung Utama UTI.jpeg')" }}><div className="min-h-screen bg-black/60 pb-10"><VariantAssessment mode="trial" onBack={() => setVariant('menu')} /></div></div>;
            if (variant === 'cepat') return <div className="min-h-screen bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('./gambar/Gedung Utama UTI.jpeg')" }}><div className="min-h-screen bg-black/60 pb-10"><VariantAssessment mode="cepat" onBack={() => setVariant('menu')} /></div></div>;
            if (variant === 'lengkap') return <div className="min-h-screen bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('./gambar/Gedung Utama UTI.jpeg')" }}><div className="min-h-screen bg-black/60 pb-10"><VariantAssessment mode="lengkap" onBack={() => setVariant('menu')} /></div></div>;
            if (variant === 'explorer') return <div className="min-h-screen bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('./gambar/Gedung Utama UTI.jpeg')" }}><div className="min-h-screen bg-black/60 pb-10"><VariantExplorer onBack={() => setVariant('menu')} /></div></div>;

            return (
                <div className="min-h-screen bg-cover bg-center bg-fixed font-sans" style={{ backgroundImage: "url('./gambar/Gedung Utama UTI.jpeg')" }}>
                    <div className="min-h-screen bg-black/60 p-6 flex flex-col">

                        <FeedbackModal isOpen={showGlobalReview} onClose={() => setShowGlobalReview(false)} />

                        {/* Header UTI */}
                        <header className="flex items-center justify-between bg-white/10 backdrop-blur-md p-4 rounded-2xl mb-10 max-w-6xl mx-auto w-full border border-white/20 shadow-lg">
                            <div className="flex items-center gap-4">
                                <img src="gambar/logouti.png" alt="Logo UTI" className="h-16 bg-white p-1 rounded-lg" />
                                <div className="text-white">
                                    <h1 className="text-2xl font-bold text-yellow-400 drop-shadow-md">Universitas Teknokrat Indonesia</h1>
                                    <p className="text-sm opacity-90">EduTalent Asesmen - Sistem Asesmen Mandiri Minat dan Karakter</p>
                                </div>
                            </div>
                            <button
                                onClick={() => setShowGlobalReview(true)}
                                className="bg-white/20 hover:bg-yellow-500 text-white p-3 rounded-xl transition-all border border-white/30 group">
                                <Icons.MessageSquare className="group-hover:scale-110 transition-transform" />
                            </button>
                        </header>

                        <div className="max-w-6xl mx-auto mb-10 text-center">
                            <h2 className="text-4xl font-extrabold text-white mb-4 drop-shadow-lg">Pilih Mode Asesmen</h2>
                            <p className="text-gray-300 text-lg">Kenali potensi diri Anda melalui instrumen yang teruji secara ilmiah.</p>
                        </div>

                        <div className="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div onClick={() => setVariant('trial')} className="bg-white/95 backdrop-blur rounded-2xl p-6 shadow-xl hover:-translate-y-2 transition-all cursor-pointer border-t-4 border-yellow-500 group flex flex-col h-full">
                                <div className="w-12 h-12 bg-yellow-100 rounded-xl flex items-center justify-center mb-4 text-yellow-600 group-hover:bg-yellow-500 group-hover:text-white transition-colors"><Icons.Target size={24} /></div>
                                <h2 className="text-lg font-bold text-red-900 mb-2">Mode Trial</h2>
                                <p className="text-sm text-gray-500 leading-relaxed mb-4 flex-1">20 Pertanyaan. Estimasi waktu: 3-5 menit. Coba sekilas bagaimana asesmen ini bekerja.</p>
                                <span className="text-yellow-600 font-bold text-xs flex items-center gap-1">Mulai Trial <Icons.ArrowRight size={12} /></span>
                            </div>

                            <div onClick={() => setVariant('cepat')} className="bg-white/95 backdrop-blur rounded-2xl p-6 shadow-xl hover:-translate-y-2 transition-all cursor-pointer border-t-4 border-orange-500 group flex flex-col h-full">
                                <div className="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center mb-4 text-orange-600 group-hover:bg-orange-500 group-hover:text-white transition-colors"><Icons.RefreshCcw size={24} /></div>
                                <h2 className="text-lg font-bold text-red-900 mb-2">Mode Cepat</h2>
                                <p className="text-sm text-gray-500 leading-relaxed mb-4 flex-1">40 Pertanyaan. Estimasi waktu: 5-10 menit. Hasil representatif dalam waktu yang singkat.</p>
                                <span className="text-orange-600 font-bold text-xs flex items-center gap-1">Mulai Tes Cepat <Icons.ArrowRight size={12} /></span>
                            </div>

                            <div onClick={() => setVariant('lengkap')} className="bg-white/95 backdrop-blur rounded-2xl p-6 shadow-xl hover:-translate-y-2 transition-all cursor-pointer border-t-4 border-red-700 group flex flex-col h-full relative overflow-hidden">
                                <div className="absolute top-3 right-3 bg-red-700 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse shadow-sm">REKOMENDASI</div>
                                <div className="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center mb-4 text-red-700 group-hover:bg-red-700 group-hover:text-white transition-colors"><Icons.FileText size={24} /></div>
                                <h2 className="text-lg font-bold text-red-900 mb-2">Mode Lengkap</h2>
                                <p className="text-sm text-gray-500 leading-relaxed mb-4 flex-1">176 Pertanyaan. Estimasi waktu: 15-25 menit. Analisis komprehensif, akurat, dan cetak PDF.</p>
                                <span className="text-red-700 font-bold text-xs flex items-center gap-1">Mulai Tes Lengkap <Icons.ArrowRight size={12} /></span>
                            </div>

                            <div onClick={() => setVariant('explorer')} className="bg-white/95 backdrop-blur rounded-2xl p-6 shadow-xl hover:-translate-y-2 transition-all cursor-pointer border-t-4 border-blue-600 group flex flex-col h-full">
                                <div className="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mb-4 text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors"><Icons.Map size={24} /></div>
                                <h2 className="text-lg font-bold text-red-900 mb-2">Peta Karir</h2>
                                <p className="text-sm text-gray-500 leading-relaxed mb-4 flex-1">Eksplorasi database profesi, skill, dan estimasi penghasilan modern.</p>
                                <span className="text-blue-600 font-bold text-xs flex items-center gap-1">Jelajahi Karir <Icons.ArrowRight size={12} /></span>
                            </div>
                        </div>

                        <div className="mt-auto pt-10 text-center text-sm text-gray-400">
                            <p>&copy; 2026 Universitas Teknokrat Indonesia</p>
                            <p className="mt-1">EduTalentAsesmen by Rakhmat Dedi G & Team</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
